# cpplint settings (Google's C++ style checker) for the 2026 season.
# Run `python scripts/lint.py` to check your changes. Seasons with
# a CPPLINT.cfg are checked; copy this file, .clang-format, and .editorconfig
# into each new season folder.
set noparent
linelength=80
extensions=ino,h,hpp,c,cpp

# Header guards are named relative to this folder, e.g. FSB_CODE_FSB_CODE_H_.
root=.

# Arduino libraries are included by bare name (<CAN.h>), not by path.
filter=-build/include_subdir
# Arduino sketches don't carry per-file license headers.
filter=-legal/copyright
# This check spots constant array sizes by their kCamelCase name. We name
# constants in snake_case, so every constexpr-sized array would be flagged.
filter=-runtime/arrays
# This check wants <algorithm> for max()/min() and other standard library
# headers. On Arduino, max() and min() come from Arduino.h, so it only produces
# false alarms. Including our own and library headers is still checked in
# review and by the compiler.
filter=-build/include_what_you_use
