# Compiles each 2026 board sketch for the Feather M4 CAN with the real
# Adafruit core and libraries, the same way the Arduino IDE does. This
# catches problems the host tests' fakes can't: real library headers,
# missing or duplicate includes, and code that only the ARM compiler sees.

name: Firmware compile

on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the older, now-stale run.
concurrency:
  group: firmware-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FQBN: adafruit:samd:adafruit_feather_m4_can
  ADAFRUIT_INDEX: https://adafruit.github.io/arduino-board-index/package_adafruit_index.json

jobs:
  compile:
    name: Compile ${{ matrix.sketch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch:
          - 2026/ControlBoard
          - 2026/FSB_CODE
          - 2026/Telemetry/Telemetry_Sender
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ hashFiles('.github/workflows/firmware-compile.yml') }}

      - name: Install the Adafruit SAMD core and libraries
        run: |
          arduino-cli config init --overwrite \
            --additional-urls "$ADAFRUIT_INDEX"
          arduino-cli core update-index
          arduino-cli core install adafruit:samd
          arduino-cli lib install \
            "CAN Adafruit Fork" \
            "Adafruit NeoPixel" \
            "Adafruit_VL6180X" \
            "Adafruit SPIFlash" \
            "Servo"
          arduino-cli core list
          arduino-cli lib list

      - name: Compile
        # BMX160 isn't in the Library Manager; the team's copy is in 2024/.
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings default \
            --library 2024/BMX160 "${{ matrix.sketch }}"
