# Checks firmware formatting and lint on every push.
#
# Only files that changed relative to a base branch are checked, matching
# what scripts/format.py and scripts/lint.py do locally:
#   - pushes to dev are compared against master (what dev would merge into)
#   - pushes to any other branch are compared against dev
# See 2026/CODE_STANDARDS.md for how to fix failures locally.

name: Firmware style

on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the older, now-stale run.
concurrency:
  group: firmware-style-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAIN_BRANCH: master
  DEV_BRANCH: dev

jobs:
  style:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the scripts can find the merge base with the
          # base branch.
          fetch-depth: 0

      - name: Pick base branch
        id: base
        run: |
          if [ "$GITHUB_REF_NAME" = "$DEV_BRANCH" ]; then
            base="$MAIN_BRANCH"
          else
            base="$DEV_BRANCH"
          fi
          git fetch --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base"
          echo "ref=origin/$base" >> "$GITHUB_OUTPUT"
          echo "Comparing \`$GITHUB_REF_NAME\` against \`$base\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pinned style tools
        run: python -m pip install -r scripts/requirements.txt

      - name: Check formatting (clang-format)
        run: python scripts/format.py --check "${{ steps.base.outputs.ref }}"

      # Runs even if formatting failed, so one push reports both problems.
      - name: Lint (cpplint)
        if: success() || failure()
        run: python scripts/lint.py "${{ steps.base.outputs.ref }}"
